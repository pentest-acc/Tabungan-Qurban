<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Profil Saya - Customer</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <link rel="icon" type="image/png" href="449862012_461024876565544_8336005599360571041_n__2_-removebg-preview (1).png">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
   <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { display: flex; max-width: 1200px; margin: 0 auto; background: white; border: 1px solid #ddd; }
        
        
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="profile-header">
            <div class="profile-img-box">
                <img id="sidebarPhoto" src="default-avatar.png">
            </div>
            <div class="username-display" id="sidebarUsername">@username</div>
        </div>
         <ul class="menu-list">
            <li class="menu-item" id="btnBiodata" onclick="showSection('biodata')"><i class="fas fa-user"></i> Biodata</li>
            <li class="menu-item inactive" id="btnHistory" onclick="showSection('history')"><i class="fas fa-history"></i> History Transaksi</li>
         </ul>
    </div>

      <div class="main-content" id="scrollContainer">
         <div class="header-tab">Biodata</div>
            <p class="form-title">Lengkapi Data Diri Anda</p>
            <form id="profileForm">
            <table class="biodata-table">
                <tr>
                    <td class="label-cell"><i class="fas fa-at"></i> Username* :</td>
                    <td><input type="text" id="bioUsername" class="input-field input-readonly" readonly></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-id-card"></i> Nama Lengkap* :</td>
                    <td><input type="text" id="bioNama" class="input-field input-readonly" readonly></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-envelope"></i> Email* :</td>
                    <td><input type="email" id="bioEmail" class="input-field input-readonly" readonly></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-key"></i> Password* :</td>
                    <td>
                        <div class="pass-wrapper">
                            <input type="password" id="bioPassword" class="input-field input-readonly" readonly>
                            <i class="fas fa-eye-slash" id="togglePass" onclick="togglePassword()"></i>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-map-marker-alt"></i> Tempat Lahir :</td>
                    <td><input type="text" id="bioTempatLahir" class="input-field" placeholder="Contoh: Jakarta"></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-calendar-alt"></i> Tanggal Lahir :</td>
                    <td><input type="date" id="bioTanggalLahir" class="input-field" onchange="hitungUsia()"></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-hourglass-half"></i> Usia :</td>
                    <td><input type="text" id="bioUsia" class="input-field input-readonly" readonly placeholder="Otomatis"></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-home"></i> Alamat :</td>
                    <td><textarea id="bioAlamat" class="input-field" rows="2"></textarea></td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-venus-mars"></i> Jenis Kelamin :</td>
                    <td>
                        <input type="radio" name="jk" value="Pria"> Pria 
                        <input type="radio" name="jk" value="Wanita"> Wanita
                    </td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-heart"></i> Status Pernikahan :</td>
                    <td>
                        <select id="bioStatus" class="input-field">
                            <option value="Belum Menikah">Belum Menikah</option>
                            <option value="Menikah">Menikah</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell"><i class="fas fa-book"></i> Bio :</td>
                    <td><textarea id="bioDeskripsi" class="input-field" placeholder="Ceritakan singkat tentang Anda"></textarea></td>
                </tr>
            </table>
            <button type="button" class="btn-simpan" onclick="simpanProfil()">Simpan Perubahan</button>
        </form>
        </div>
        
    </div>

<script>
    // 1. Load Data Otomatis saat halaman dibuka
    window.onload = function() {
        const savedData = JSON.parse(localStorage.getItem('userAccount'));
        if (savedData) {
            // Isi Sidebar
            document.getElementById('sidebarUsername').innerText = "@" + savedData.username;
            if(savedData.photo) document.getElementById('sidebarPhoto').src = savedData.photo;

            // Isi Form Readonly
            document.getElementById('bioUsername').value = savedData.username;
            document.getElementById('bioNama').value = savedData.namaLengkap;
            document.getElementById('bioEmail').value = savedData.email;
            document.getElementById('bioPassword').value = savedData.password;
            
            // Load data tambahan jika sudah pernah disimpan sebelumnya
            const extraData = JSON.parse(localStorage.getItem('userBiodata_' + savedData.email));
            if(extraData) {
                document.getElementById('bioTempatLahir').value = extraData.tempatLahir || '';
                document.getElementById('bioTanggalLahir').value = extraData.tanggalLahir || '';
                document.getElementById('bioAlamat').value = extraData.alamat || '';
                document.getElementById('bioStatus').value = extraData.status || 'Belum Menikah';
                document.getElementById('bioDeskripsi').value = extraData.bio || '';
                hitungUsia(); // Hitung usia jika tgl lahir ada
            }
        }
    };

    // 2. Logika Hitung Usia Otomatis
    function hitungUsia() {
        const tglLahir = document.getElementById('bioTanggalLahir').value;
        if (tglLahir) {
            const today = new Date();
            const birthDate = new Date(tglLahir);
            let age = today.getFullYear() - birthDate.getFullYear();
            const month = today.getMonth() - birthDate.getMonth();
            if (month < 0 || (month === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            document.getElementById('bioUsia').value = age + " Tahun";
        }
    }

    // 3. Logika Lihat Password
    function togglePassword() {
        const passInput = document.getElementById('bioPassword');
        const icon = document.getElementById('togglePass');
        if (passInput.type === "password") {
            passInput.type = "text";
            icon.className = "fas fa-eye";
        } else {
            passInput.type = "password";
            icon.className = "fas fa-eye-slash";
        }
    }

    // 4. Logika Simpan Data Tambahan
    function simpanProfil() {
        const savedData = JSON.parse(localStorage.getItem('userAccount'));
        const extraData = {
            tempatLahir: document.getElementById('bioTempatLahir').value,
            tanggalLahir: document.getElementById('bioTanggalLahir').value,
            alamat: document.getElementById('bioAlamat').value,
            status: document.getElementById('bioStatus').value,
            bio: document.getElementById('bioDeskripsi').value
        };
        // Simpan berdasarkan email unik user
        localStorage.setItem('userBiodata_' + savedData.email, JSON.stringify(extraData));
        alert("Biodata Berhasil Diperbarui!");
    }

    // Fungsi Utama untuk Klik Menu Sidebar
    function gantiTab(tab) {
        const btnBio = document.getElementById('btnBiodata');
        const btnHist = document.getElementById('btnHistory');
        const kontBio = document.getElementById('kontenBiodata');
        const kontHist = document.getElementById('kontenHistory');

        if (tab === 'biodata') {
            btnBio.classList.add('active');
            btnHist.classList.remove('active');
            kontBio.style.display = 'block';
            kontHist.style.display = 'none';
        } else {
            btnBio.classList.remove('active');
            btnHist.classList.add('active');
            kontBio.style.display = 'none';
            kontHist.style.display = 'block';
            renderHistoryData(); // Update data setiap kali tab diklik
        }
    }

    function renderHistoryData() {
        // Ambil info siapa yang sedang login
        const loginSkg = JSON.parse(localStorage.getItem('userAccount'));
        // Ambil database tabungan global
        const databaseTabungan = JSON.parse(localStorage.getItem('dataTabunganQurban')) || [];
        const tbody = document.getElementById('isiTabelHistory');
        
        // Filter: Hanya cari data yang usernamenya sama dengan yang login sekarang
        const filterData = databaseTabungan.filter(item => item.username === loginSkg.username);
        
        tbody.innerHTML = "";

        if (filterData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:#999;">Belum ada catatan menabung.</td></tr>`;
            return;
        }

        filterData.forEach((item, index) => {
            // Logika badge warna: Admin (Merah), Mandiri (Hijau)
            const badge = item.inputter === 'admin' ? 
                `<span class="badge badge-admin"><i class="fas fa-user-shield"></i> Admin</span>` : 
                `<span class="badge badge-mandiri"><i class="fas fa-user"></i> Mandiri</span>`;

            const baris = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.tanggal}</td>
                    <td style="font-weight:bold; color:#2c3e50;">Rp ${parseInt(item.jumlah).toLocaleString('id-ID')}</td>
                    <td>${badge}</td>
                </tr>
            `;
            tbody.innerHTML += baris;
        });
    }

    // Panggil load data profil seperti biasa saat window load...

</script>

</body>
</html>
