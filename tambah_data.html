<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tambah Data Tabungan Qurban</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="video-container">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="video-animasi-masjid.mp4" type="video/mp4" />
        <style>
            .bg-video {
            width: 100%;
            height: 100%;
            }
        </style>
    </video>
  </div>
  <div class="form-container">
      <h3>Input Tabungan Qurban</h3>
      <hr />
      <br />
      <form action="beranda.html">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" required />
        </div>
        <div class="form-group">
          <label>Tanggal Setoran</label>
          <input type="date" required />
        </div>
        <div class="form-group">
          <label>Nominal Setoran</label>
          <input type="number" placeholder="Rp." required />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select>
            <option>Aktif</option>
            <option>Selesai</option>
          </select>
        </div>
        <button type="submit" class="btn-simpan">Simpan Data</button>
        <br /><br />
        <a href="beranda.html" style="color: #666; text-decoration: none"
          >&larr; Kembali</a
        >
      </form>
  </div>
  <script>
      // Di dalam script tambah_data.html
      document
        .getElementById("formQurban")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const dataBaru = {
            nama: document.getElementById("nama").value,
            tanggal: document.getElementById("tanggal").value,
            nominal: document.getElementById("nominal").value,
            status: document.getElementById("status").value,
          };

          let daftarTabungan =
            JSON.parse(localStorage.getItem("tabunganQurban")) || [];
          daftarTabungan.push(dataBaru);
          localStorage.setItem(
            "tabunganQurban",
            JSON.stringify(daftarTabungan),
          );

          // KEMBALI KE BERANDA.HTML
          window.location.href = "beranda.html#layanan";
        });
  </script>
</body>
</html>
