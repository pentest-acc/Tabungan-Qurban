<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masjid Jami'Nurul Hikmah</title>
    <link rel="icon" type="image/png" href="449862012_461024876565544_8336005599360571041_n__2_-removebg-preview (1).png">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="video-container">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="video-animasi-masjid.mp4" type="video/mp4" />
            <style>
            .bg-video {
            width: 100%;
            height: 100%;
            }
            </style>
        </video>
    </div>

    <div class="form-input-container">
    <h3>Input Pemasukan Kas</h3>
        <form id="formPemasukan">
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="ket" placeholder="Contoh: Infaq Jumat" required>
            </div>
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="tgl" required>
            </div>
            <div class="form-group">
                <label>Nama Donatur</label>
                <input type="text" id="nama" placeholder="Hamba Allah" required>
            </div>
            <div class="form-group">
                <label>Jumlah (Rp)</label>
                <input type="number" id="jml" onkeydown="cekanakpanah(event)" placeholder="Rp. " required>
            </div>
            <button type="submit" class="btn-simpan-data">Simpan Pemasukan</button>
        </form>
        <a href="beranda.html#transparansi" class="link-kembali">← Batal dan Kembali</a>
    </div>

    <script>
    document.getElementById('formPemasukan').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const data = {
        keterangan: document.getElementById('ket').value,
        tanggal: document.getElementById('tgl').value,
        nama: document.getElementById('nama').value,
        jumlah: document.getElementById('jml').value
    };

    let list = JSON.parse(localStorage.getItem('dataPemasukan')) || [];
    list.push(data);
    localStorage.setItem('dataPemasukan', JSON.stringify(list));
    window.location.href = 'beranda.html#transparansi';
    });

    function cekanakpanah(e) {
    // Angka 40 adalah kode kunci (keyCode) untuk tombol panah bawah
    if (e.keyCode === 40) {
        e.preventDefault(); // Menggagalkan aksi pengurangan angka
    }
    }
    </script>
</body>
</html>
