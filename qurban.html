<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Data Qurban</title>
    <link rel="icon" type="image/png" href="449862012_461024876565544_8336005599360571041_n__2_-removebg-preview (1).png">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>
    <div class="video-container">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="video-animasi-masjid.mp4" type="video/mp4" />
        <style>
            .bg-video {
            width: 100%;
            height: 100%;
            }
        </style>
    </video>
    </div>
    <div class="form-container">
        <h3>Input Tabungan Qurban</h3>
        <hr />
        <br />
        <form action="beranda.html">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="qUser" placeholder="Masukkan username" oninput="cariNama()">
        </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="qNama" readonly placeholder="Nama otomatis muncul">
        </div>
        <div class="form-group">
            <label>Tanggal Setoran</label>
            <input type="date" required />
        </div>
        <div class="form-group">
            <label>Nominal Setoran</label>
            <input type="text" value="Rp. 3.400.000" readonly class="readonly-input">
            <input type="hidden" id="nominalQ" value="3400000">
        </div>
        <button type="submit" class="btn-simpan">Simpan Data</button>
        <br /><br />
        <a href="beranda.html" style="color: #666; text-decoration: none"
            >&larr; Kembali
        </a>
        </form>
    </div>

    <script>
        function cariNama() {
            const userInput = document.getElementById('qUser').value;
            const namaField = document.getElementById('qNama');
            
            // Mengambil data akun dari localStorage (sesuaikan dengan key registrasi Anda)
            const listAkun = JSON.parse(localStorage.getItem('userAccounts')) || [];
            const ketemu = listAkun.find(u => u.username === userInput);
            
            namaField.value = ketemu ? ketemu.namaLengkap : "";
        }

        function prosesSimpan() {
            const data = {
                username: document.getElementById('qUser').value,
                nama: document.getElementById('qNama').value,
                nominal: document.getElementById('qNominal').value,
                tanggal: document.getElementById('qTanggal').value,
                oleh: 'admin' // Menandakan diinput oleh admin
            };

            if(!data.username || !data.nama || !data.tanggal) {
                alert("Lengkapi data jamaah!");
                return;
            }

            let database = JSON.parse(localStorage.getItem('dataQurbanFinal')) || [];
            database.push(data);
            localStorage.setItem('dataQurbanFinal', JSON.stringify(database));

            alert("Data Berhasil Ditambahkan!");
            window.location.href = 'beranda.html';
        }
    </script>
</body>
</html>
