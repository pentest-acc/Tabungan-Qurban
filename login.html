<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="449862012_461024876565544_8336005599360571041_n__2_-removebg-preview (1).png">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 60px 20px 10px;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('background-masjid-malam.jpg');
            background-size: cover; font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="video-animasi-masjid.mp4" type="video/mp4" />
            <style>
                .bg-video {
                width: 100%;
                height: 100%;
                }
            </style>
        </video>
    </div>

    <div class="login-box">
        <div class="profile-img" id="profileDisplay">
            <i class="fas fa-user-circle fa-5x" style="color: #ccc;"></i>
        </div>
        <h2>LOGIN</h2>
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPass" placeholder="Password" required>
                <i class="fas fa-eye-slash toggle-pass" onclick="togglePassword('loginPass', this)"></i>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <div class="footer-text">
            Belum punya akun? <a href="akun_baru.html">Buat akun baru</a>
        </div>
    </div>

    <script>
    // Logika autofill dan kasta tetap sama seperti instruksi sebelumnya
    document.getElementById('loginEmail').addEventListener('input', function() {
        const savedData = JSON.parse(localStorage.getItem('userAccount'));
        if(savedData && this.value === savedData.email) {
            document.getElementById('loginPass').value = savedData.password;
            if(savedData.photo) {
                document.getElementById('profileDisplay').innerHTML = `<img src="${savedData.photo}">`;
            }
        }
    });

    function togglePassword(id, el) {
        const x = document.getElementById(id);
        x.type = x.type === "password" ? "text" : "password";
        el.className = x.type === "password" ? "fas fa-eye-slash toggle-pass" : "fas fa-eye toggle-pass";
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const prioritas = ['ilham@gmail.com', 'admin1@gmail.com', 'admin2@gmail.com', 'admin3@gmail.com', 'admin4@gmail.com'];
        window.location.href = prioritas.includes(email) ? 'beranda.html' : 'beranda_biasa.html';
    });
    </script>
</body>
</html>
