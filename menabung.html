<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tambah Data Tabungan Qurban</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="video-container">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="video-animasi-masjid.mp4" type="video/mp4" />
        <style>
            .bg-video {
            width: 100%;
            height: 100%;
            }
        </style>
    </video>
  </div>
  <div class="form-input-container">
    <h3>Menabung Tabungan Qurban</h3>
    <form id="formMenabung">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="userInput" readonly> </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaInput" readonly> </div>
        <div class="form-group">
            <label>Tanggal Setoran</label>
            <input type="date" id="tglInput" required>
        </div>
        <div class="form-group">
            <label>Jumlah Setoran (Rp)</label>
            <input type="number" id="jmlInput" placeholder="Masukkan jumlah..." required>
        </div>
        
        <button type="submit" class="btn-simpan-data">Kirim Setoran</button>
    </form>
    <a href="beranda_biasa.html" class="link-kembali">← Kembali</a>
</div>
  <script>
      // Di dalam script tambah_data.html
      document
        .getElementById("formQurban")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const dataBaru = {
            nama: document.getElementById("nama").value,
            tanggal: document.getElementById("tanggal").value,
            nominal: document.getElementById("nominal").value,
            status: document.getElementById("status").value,
          };

          let daftarTabungan =
            JSON.parse(localStorage.getItem("tabunganQurban")) || [];
          daftarTabungan.push(dataBaru);
          localStorage.setItem(
            "tabunganQurban",
            JSON.stringify(daftarTabungan),
          );

          // KEMBALI KE BERANDA.HTML
          window.location.href = "beranda.html#layanan";
        });

        
        // Fungsi untuk berpindah tampilan antara Biodata dan History
    function showSection(section) {
        if (section === 'biodata') {
            document.getElementById('sectionBiodata').style.display = 'block';
            document.getElementById('sectionHistory').style.display = 'none';
            document.getElementById('btnBiodata').classList.remove('inactive');
            document.getElementById('btnHistory').classList.add('inactive');
        } else {
            document.getElementById('sectionBiodata').style.display = 'none';
            document.getElementById('sectionHistory').style.display = 'block';
            document.getElementById('btnBiodata').classList.add('inactive');
            document.getElementById('btnHistory').classList.remove('inactive');
            renderHistory(); // Panggil fungsi render data
        }
    }

    function renderHistory() {
        const savedData = JSON.parse(localStorage.getItem('userAccount'));
        const allTransactions = JSON.parse(localStorage.getItem('dataTabunganQurban')) || [];
        const tableBody = document.getElementById('historyTableBody');
        
        // Filter data: Hanya ambil transaksi yang usernamenya cocok dengan user yang login
        const myTransactions = allTransactions.filter(t => t.username === savedData.username);
        
        tableBody.innerHTML = "";

        if (myTransactions.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Belum ada riwayat transaksi.</td></tr>`;
            return;
        }

        myTransactions.forEach((item, index) => {
            // Tentukan status input (Mandiri vs Admin)
            // Catatan: Di file menabung.html dan tambah_data.html Anda perlu menambahkan field 'inputter'
            const diprosesOleh = item.inputter === 'admin' ? 
                '<span style="color:red; font-weight:bold;"><i class="fas fa-user-shield"></i> Admin</span>' : 
                '<span style="color:green; font-weight:bold;"><i class="fas fa-user"></i> Mandiri</span>';

            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.tanggal}</td>
                    <td>Rp ${parseInt(item.jumlah).toLocaleString()}</td>
                    <td>${diprosesOleh}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

  
  </script>
  <script src="script.js"></script>
</body>
</html>
