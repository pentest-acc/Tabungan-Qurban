<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat Akun</title>
    <link rel="icon" type="image/png" href="449862012_461024876565544_8336005599360571041_n__2_-removebg-preview (1).png">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Perubahan: min-height agar jika konten panjang bisa di-scroll dan tidak terpotong */
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            /* Padding ditambahkan agar saat di layar kecil tidak mepet ke tepi atas/bawah */
            padding: 100px 20px 50px; 
            
            font-family: 'Poppins', sans-serif;
        }

        
    </style>
</head>
<body>
    <div class="video-container">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="video-animasi-masjid.mp4" type="video/mp4" />
        <style>
            .bg-video {
            width: 100%;
            height: 100%;
            }
        </style>
    </video>
    </div>
    
    <div class="signin-box">
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-camera fa-2x"></i>
        <img id="preview" style="display:none">
    </div>
    <input type="file" id="fileInput" style="display:none" accept="image/*">
    
    <h2>SignIn</h2>
    <form id="signInForm">
        <div class="input-group"><i class="fas fa-user"></i><input type="text" placeholder="Username" required></div>
        <div class="input-group"><i class="fas fa-address-card"></i><input type="text" placeholder="Nama Lengkap" required></div>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="regEmail" placeholder="Email" required></div>
        
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="regPass" placeholder="Password (Min 8 Karakter)" minlength="8" required>
            <i class="fas fa-eye-slash toggle-pass" onclick="toggleRegPass('regPass', this)"></i>
        </div>
        
        <div class="input-group">
            <i class="fas fa-check-double"></i>
            <input type="password" id="confirmPass" placeholder="Konfirmasi Password" required>
            <i class="fas fa-eye-slash toggle-pass" onclick="toggleRegPass('confirmPass', this)"></i>
        </div>
        <p id="errorText" class="error-msg">Maaf anda harus mengisi password yang sama.</p>

        <button type="submit" class="btn-submit">Buat Akun</button>
    </form>
    
    <div class="link-kembali">
        Sudah punya akun? <a href="login.html">Login</a>
    </div>
</div>

<script>
    // Logika pemilihan foto
    document.getElementById('fileInput').addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                localStorage.setItem('tempPhoto', e.target.result);
            };
            reader.readAsDataURL(file);
        }
    });

    // Logika lihat password
    function toggleRegPass(id, el) {
        const x = document.getElementById(id);
        if (x.type === "password") {
            x.type = "text";
            el.className = "fas fa-eye toggle-pass";
        } else {
            x.type = "password";
            el.className = "fas fa-eye-slash toggle-pass";
        }
    }

    // Logika simpan data & pengalihan kasta
    document.getElementById('signInForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const confirm = document.getElementById('confirmPass').value;
        
        if (pass !== confirm) {
            document.getElementById('errorText').style.display = 'block';
            return;
        }

        const accountData = {
            email: email,
            password: pass,
            photo: localStorage.getItem('tempPhoto')
        };
        localStorage.setItem('userAccount', JSON.stringify(accountData));

        const prioritas = ['ilham@gmail.com', 'admin1@gmail.com', 'admin2@gmail.com', 'admin3@gmail.com', 'admin4@gmail.com'];
        alert("Akun berhasil dibuat!");
        
        // Cek kasta email untuk menentukan tujuan halaman
        if (prioritas.includes(email)) {
            window.location.href = 'beranda.html';
        } else {
            window.location.href = 'beranda_biasa.html';
        }
    });
</script>
</body>
</html>
